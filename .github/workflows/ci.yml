# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q entelechy tests

  cpu-tests:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: pytest
      - name: Generate the static compiler corpus
        run: |
          for op in rmsnorm softmax silu_mul; do
            entelechy loop init examples/trace --definition "${op}_example" --baseline "${op}_example_torch_baseline" --output "$RUNNER_TEMP/entelechy-$op"
            entelechy loop submit "$RUNNER_TEMP/entelechy-$op" --ir "$RUNNER_TEMP/entelechy-$op/draft.ir.json"
          done

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --outdir dist/ci
      - run: python -m twine check --strict dist/ci/*
      - name: Install the wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/entelechy-wheel"
          "$RUNNER_TEMP/entelechy-wheel/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/ci/*.whl
          "$RUNNER_TEMP/entelechy-wheel/bin/python" -c 'import sys, entelechy; assert "torch" not in sys.modules'
          "$RUNNER_TEMP/entelechy-wheel/bin/python" -c 'from entelechy.licensing import project_license_text; assert "Apache License" in project_license_text()'
          "$RUNNER_TEMP/entelechy-wheel/bin/entelechy" --version
          "$RUNNER_TEMP/entelechy-wheel/bin/entelechy" trace inspect "$GITHUB_WORKSPACE/examples/trace" --definition rmsnorm_example
