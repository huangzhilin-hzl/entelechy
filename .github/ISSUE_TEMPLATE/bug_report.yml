name: Bug report
description: Report a reproducible failure in the compiler, runtime, or tooling.
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow SECURITY.md instead of sharing details here.
        Remove credentials, private data, and sensitive paths from attachments.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Explain what should happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, a minimal native TraceSet or IR, and the error output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the revision, Python version, operating system, and GPU/toolchain versions if relevant. Attach sanitized doctor output when available.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Include relevant diagnostics, raw records, or a regression range.
